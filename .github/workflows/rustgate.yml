name: RustGate

on:
  push:
    paths: [ "rustgate/**", ".github/workflows/rustgate.yml" ]
  pull_request:
    paths: [ "rustgate/**", ".github/workflows/rustgate.yml" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rustgate
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rustgate
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RUSTGATE_TEST_POSTGRES_URL: host=localhost port=5432 user=postgres password=postgres dbname=rustgate
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Format
      run: cargo fmt --check
    - name: Lint
      run: cargo clippy --locked --all-targets --all-features -- -D warnings
    - name: Test (in-memory and file journals)
      run: cargo test --locked
    - name: Test (PostgreSQL journal)
      run: cargo test --locked --all-features
    - name: Demo
      run: |
        cargo run --locked --bin rustgate-demo -- --bundle evidence-bundle.json --journal store.jsonl
        cargo run --locked --bin rustgate-demo -- --journal store.jsonl
