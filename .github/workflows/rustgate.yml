name: RustGate

on:
  push:
    paths: [ "rustgate/**", ".github/workflows/rustgate.yml" ]
  pull_request:
    paths: [ "rustgate/**", ".github/workflows/rustgate.yml" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rustgate
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Format
      run: cargo fmt --check
    - name: Lint
      run: cargo clippy --locked --all-targets -- -D warnings
    - name: Test
      run: cargo test --locked
    - name: Demo
      run: cargo run --locked --bin rustgate-demo -- --bundle evidence-bundle.json
